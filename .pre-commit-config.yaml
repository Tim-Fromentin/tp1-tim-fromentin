repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: tests unitaires
        entry: ./.venv/Scripts/py.test.exe -q
        language: script
        pass_filenames: false
        always_run: true
